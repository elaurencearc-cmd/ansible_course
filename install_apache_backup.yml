---
- hosts: all
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

  - name: install apache2 package
    ansible.builtin.apt:
       name:
         - apache2
         - libapache2-mod-php
       state: latest
       update_cache: yes
    when: ansible_facts["distribution"] == "Ubuntu"

  - name: install httpd package
    ansible.builtin.dnf:
       name:
         - httpd
         - php
       state: latest
       update_cache: yes
    when: ansible_facts["distribution"] == "Fedora"



