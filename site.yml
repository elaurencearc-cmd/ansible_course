---
- hosts: all
  become: true
  vars:
   ansible_python_interpreter: /usr/bin/python3
  pre_tasks:

  - name: install updates for fedora
    tags: always
    ansible.builtin.dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "Fedora"

  - name: install updates for Ubuntu
    tags: always
    ansible.builtin.apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

  - name: create user
    tags: always
    ansible.builtin.user:
      name: Maureen
      groups: root

  - name: add sudoers file for Maureen
    tags: always
    ansible.builtin.copy:
      src: sudoers_Maureen
      dest: /etc/sudoers.d/Maureen
      owner: root
      group: root
      mode: 0440

  - name: add ssh key for Maureen
    tags: always
    ansible.builtin.authorized_key:
      user: Maureen
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBMyhO3aPfGh2PjPnn3uoqosfCZMShloEY2NzbWswEY7 laurencee@ubuntu-ws"

- hosts: web_servers
  become: true
  vars:
   ansible_python_interpreter: /usr/bin/python3
  tasks:

  - name: install apache on web servers
    tags: apache,ubuntu
    ansible.builtin.apt:
      name:
         - apache2
         - libapache2-mod-php
    when: ansible_distribution == "Ubuntu"

  - name: install apache on web servers
    tags: apache,ubuntu
    ansible.builtin.dnf:
      name: httpd
    when: ansible_distribution == "Fedora"

  - name: ensure apache is running (ubuntu)
    tags: apache,ubuntu
    ansible.builtin.service:
      name: apache2
      state: started
    when: ansible_distribution == "Ubuntu"

  - name: ensure apache is running (fedora)
    tags: apache,ubuntu
    ansible.builtin.service:
      name: httpd
      state: started
    when: ansible_distribution == "Fedora"

  - name: change the email for admin
    tags: apache,ubuntu
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin edgarlawrence_2003@hotmail.com
    when: ansible_distribution == "Fedora"
    register: httpd

  - name: restart httpd (fedora)
    tags: apache,fedora
    ansible.builtin.service:
      name: httpd
      state: restarted
    when: httpd.changed

  - name: copy html files for site
    tags: apache,ubuntu
    ansible.builtin.copy:
      src: default_sites.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

- hosts: db_servers
  tags: db,fedora
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
   - name: install mariadb package on db servers 
     ansible.builtin.dnf:
        name: mariadb
        state: latest
     when: ansible_distribution == "Fedora"
